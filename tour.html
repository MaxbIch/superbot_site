<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Туры SuperBot Nha Trang">
    <title>Тур — SuperBot Nha Trang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .tour-page {
            padding: 0 10px;
            background: #f7faf8;
            min-height: 100vh
        }

        .tour-page__top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 25px
        }

        .tour-back {
            color: #2f8e5e;
            text-decoration: none;
            font-weight: 700
        }

        .tour-page__location {
            font-size: 14px;
            color: #4caf7a;
            font-weight: 700
        }

        .tour-detail {
            background: #fff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 45px rgba(28, 45, 36, .10)
        }

        .tour-gallery {
            position: relative;
            background: #15221b
        }

        .tour-gallery__main {
            height: 520px;
            overflow: hidden
        }

        .tour-gallery__main img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover
        }

        .tour-gallery__arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 46px;
            height: 46px;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, .92);
            color: #2f8e5e;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            z-index: 3;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .16)
        }

        .tour-gallery__arrow--prev {
            left: 20px
        }

        .tour-gallery__arrow--next {
            right: 20px
        }

        .tour-gallery__thumbs {
            display: flex;
            gap: 10px;
            padding: 12px;
            overflow-x: auto;
            background: #17241d
        }

        .tour-gallery__thumb {
            flex: 0 0 88px;
            height: 64px;
            padding: 0;
            border: 2px solid transparent;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            opacity: .65;
            background: none
        }

        .tour-gallery__thumb.is-active {
            border-color: #4caf7a;
            opacity: 1
        }

        .tour-gallery__thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .tour-content {
            padding: 34px
        }

        .tour-content h1 {
            margin: 0;
            font-size: 42px;
            color: #1e2a24
        }

        .tour-content__lead {
            margin: 10px 0 0;
            color: #66736c;
            font-size: 17px;
            line-height: 1.7;
            max-width: 850px
        }

        .tour-info-grid {
            display: grid;
            grid-template-columns:repeat(3, 1fr);
            gap: 14px;
            margin: 25px 0
        }

        .tour-info {
            padding: 5px 10px;
            font-size: 14px;
            border-radius: 10px;
            background: #f1f7f3;
            line-height: 16px;
        }

        .tour-info span {
            display: block;
            font-size: 12px;
            color: #6d7772;
            margin-bottom: 5px
        }

        .tour-info strong {
            font-size: 15px;
            color: #243229
        }

        .tour-columns {
            display: grid;
            grid-template-columns:1fr 1fr;
            gap: 35px;
            margin-top: 28px
        }

        .tour-columns h2 {
            font-size: 20px;
            margin: 0 0 12px
        }

        .tour-columns ul {
            list-style: none;
            margin: 0;
            padding: 0
        }

        .tour-columns li {
            padding: 10px 0 10px 20px;
            border-bottom: 1px solid #edf0ee;
            color: #5f6d65;
            position: relative;
            font-size: 14px;
            line-height: 14px;
        }

        .tour-columns li:before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #4caf7a;
            font-weight: 800
        }

        .tour-bot {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 32px;
            min-height: 56px;
            border-radius: 15px;
            background: #4caf7a;
            color: #fff;
            text-decoration: none;
            font-weight: 800;
            font-size: 16px
        }

        .tour-bot:hover {
            background: #3f9d6c
        }

        .tour-error {
            text-align: center;
            padding: 100px 20px
        }

        .tour-error h1 {
            margin-bottom: 12px
        }

        .tour-error a {
            color: #2f8e5e;
            font-weight: 700
        }

        @media (max-width: 700px) {
            .tour-gallery__main {
                height: 300px
            }

            .tour-content {
                padding: 10px
            }

            .tour-content h1 {
                font-size: 31px
            }

            .tour-content__lead {
                font-size: 14px
            }

            .tour-info-grid {
                grid-template-columns:1fr
            }

            .tour-columns {
                grid-template-columns:1fr;
                gap: 25px
            }

            .tour-gallery__arrow {
                width: 30px;
                height: 30px;
                font-size: 30px;
                text-align: center;
                display: flex;
                align-items: center;
                margin: auto;
                padding-left: 10px;
                padding-bottom: 4px;
            }

            .tour-gallery__arrow--prev {
                left: 10px
            }

            .tour-gallery__arrow--next {
                right: 10px
            }
            .tour-info-grid {
                gap: 10px;
                margin: 10px 0;
            }
            .tour-info strong {
                font-size: 12px;
                color: #243229;
            }
            .tour-columns {
                margin-top: 15px;
            }
            .tour-columns h2 {
                font-size: 20px;
                margin: 0;
            }
            .tour-bot {
                margin-top: 30px;
                font-weight: 600;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<main class="tour-page">
    <div class="container">
        <div class="tour-page__top"><a class="tour-back" href="index.html#tours">← Все туры</a><a
                class="tour-page__location" href="https://t.me/nha_trang_superbot" target="_blank"
                rel="noopener noreferrer">SuperBot Nha Trang</a></div>
        <div id="tour-root"></div>
    </div>
</main>
<script>
    (function () {
        var BOT = 'https://t.me/nha_trang_superbot';
        var TOURS = {
            dalat: {
                title: 'Далат',
                location: 'Город вечной весны',
                lead: 'Однодневная поездка в Далат с главными природными и атмосферными местами города.',
                price: '1 000 000 ₫ взрослый · 500 000 ₫ ребёнок',
                time: '07:00 — около 20:00',
                type: 'Однодневный тур',
                images: [
                    ['https://a.cdn-hotels.com/gdcs/production130/d1228/57affb67-9d6b-4894-aacb-afc20bcd91c2.jpg?h=533&impolicy=fcrop&q=medium&w=800', 'Водопад Далата'],
                    ['https://www.quinta.ru/upload/iblock/471/8isg01uxefhaphmr6y7sr81l5w2vfs9a/new-dalat-lead.jpeg', 'Crazy House'],
                    ['https://blog.wayro.ai/sites/default/files/inline-images/Coffee%20plantations%20%28Cau%20Dat%20%20Lak%20area%29.jpg', 'Кофейные плантации'],
                    ['https://3.bp.blogspot.com/-5pb-toO0f_A/UrJt9JTfHzI/AAAAAAAAM4g/6AZJn8WBg4w/s1600/P5244898-001.JPG', 'Crazy House и сады']
                ],
                program: ['Водопады Далата', 'Кофейная плантация', 'Crazy House', 'Цветочная деревня', 'Пагода Линь Фуок', 'Рынок Далата'],
                included: ['Транспорт', 'Русскоязычный гид', 'Обед', 'Вода', 'Страховка', 'Входные билеты']
            },
            baho: {
                title: 'Ба Хо',
                location: 'Три уровня водопада',
                lead: 'Активная поездка в джунгли Нячанга: водопады, природные бассейны, скалы и купание.',
                price: '500 000 ₫ с человека',
                time: '08:00 — около 16:00',
                type: 'Активный тур',
                images: [
                    ['https://cms.enjourney.ru/upload/country/article/512x512/535_1.png', 'Водопады Ба Хо'],
                    ['https://cdn.getyourguide.com/image/format%3Dauto%2Cfit%3Dcrop%2Cgravity%3Dcenter%2Cquality%3D60%2Cwidth%3D450%2Cheight%3D450%2Cdpr%3D2/tour_img/6045a7adb1defc4869bd14ddcd68daadf6b17e8602aa402597ba88b0b4f065fe.jpg', 'Природный бассейн'],
                    ['https://asialegend.travel/wp-content/uploads/2024/01/Things-to-Do-in-Nha-Trang-Take-a-Day-Trip-to-Ba-Ho-Waterfalls.jpg', 'Ба Хо — джунгли и скалы']
                ],
                program: ['Первый уровень водопада', 'Второй уровень', 'Третий уровень', 'Купание в природных бассейнах', 'Прыжки со скал', 'Пикник на природе'],
                included: ['Трансфер', 'Гид', 'Обед', 'Вода', 'Страховка']
            },
            vinpearl: {
                title: 'Винперл',
                location: 'VinWonders Nha Trang · остров Хон Тре',
                lead: 'Полный день развлечений на острове Хон Тре: канатная дорога, аквапарк, аттракционы и парковые зоны.',
                price: 'Стоимость уточняется в боте',
                time: 'Полный день',
                type: 'Развлекательный тур',
                images: [
                    ['https://images.lonelyplanetitalia.it/uploads/xtREyw78rKnGiP4O9Rw00WhaUSN4NnZN.jpg?p=slider&q=80&s=2664530e57632934f6c88d7e65234337f', 'Канатная дорога через залив'],
                    ['https://d2mgzmtdeipcjp.cloudfront.net/files/magazine/2025/03/11/17416793147938.png', 'VinWonders с высоты'],
                    ['https://images.trvl-media.com/lodging/10000000/9770000/9762000/9761937/b421848d.jpg?impolicy=resizecrop&ra=fill&rh=575&rw=575', 'Аквапарк VinWonders'],
                    ['https://cdn.tcdulichtphcm.vn/upload/1-2026/images/2026-03-06/Cap-treo-Vinpearl-Nha-Trang-lot-Top-cap-treo-dep-nhat-chau-a-2--1--1772801831-995-width1536height1024.jpg', 'Канатная дорога Vinpearl']
                ],
                program: ['Канатная дорога над заливом', 'Аквапарк', 'Аттракционы', 'Остров Хон Тре', 'Парковые зоны', 'Развлекательные программы'],
                included: ['Канатная дорога', 'Доступ в VinWonders', 'Аквапарк', 'Аттракционы']
            },
            islands: {
                title: '4 острова',
                location: 'Острова Нячанга и море',
                lead: 'Морская прогулка по островам Нячанга с купанием, снорклингом и отдыхом на побережье.',
                price: 'Стоимость уточняется в боте',
                time: '08:00 — около 16:30',
                type: 'Морская экскурсия',
                images: [
                    ['https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&h=800&fit=crop', 'Море и острова Нячанга'],
                    ['https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=1200&h=800&fit=crop', 'Снорклинг'],
                    ['https://images.unsplash.com/photo-1540202404-a2f29016b523?w=1200&h=800&fit=crop', 'Остров и пляж']
                ],
                program: ['Морская прогулка по заливу', 'Остановки на островах', 'Купание в море', 'Снорклинг', 'Отдых на пляже', 'Обед на маршруте'],
                included: ['Трансфер', 'Лодка', 'Снаряжение для снорклинга', 'Обед', 'Вода']
            }
        };
        var key = new URLSearchParams(location.search).get('tour') || 'dalat', tour = TOURS[key],
            root = document.getElementById('tour-root');
        if (!tour) {
            root.innerHTML = '<div class="tour-error"><h1>Тур не найден</h1><p>Вернитесь к списку туров.</p><a href="index.html#tours">Вернуться к турам</a></div>';
            return;
        }
        root.innerHTML = '<article class="tour-detail"><div class="tour-gallery"><div class="tour-gallery__main"><img id="tour-main-image" src="' + tour.images[0][0] + '" alt="' + tour.images[0][1] + '"></div><button class="tour-gallery__arrow tour-gallery__arrow--prev" type="button" aria-label="Предыдущая фотография">‹</button><button class="tour-gallery__arrow tour-gallery__arrow--next" type="button" aria-label="Следующая фотография">›</button><div class="tour-gallery__thumbs" id="tour-thumbs"></div></div><div class="tour-content"><div class="tour-page__location">' + tour.location + '</div><h1>' + tour.title + '</h1><p class="tour-content__lead">' + tour.lead + '</p><div class="tour-info-grid"><div class="tour-info"><span>Стоимость</span><strong>' + tour.price + '</strong></div><div class="tour-info"><span>Время</span><strong>' + tour.time + '</strong></div><div class="tour-info"><span>Формат</span><strong>' + tour.type + '</strong></div></div><div class="tour-columns"><section><h2>Программа</h2><ul>' + tour.program.map(function (x) {
            return '<li>' + x + '</li>';
        }).join('') + '</ul></section><section><h2>Входит в тур</h2><ul>' + tour.included.map(function (x) {
            return '<li>' + x + '</li>';
        }).join('') + '</ul></section></div><a class="tour-bot" href="' + BOT + '" target="_blank" rel="noopener noreferrer">Узнать подробнее в Telegram-боте →</a></div></article>';
        var index = 0, main = document.getElementById('tour-main-image'),
            thumbs = document.getElementById('tour-thumbs');
        tour.images.forEach(function (img, i) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'tour-gallery__thumb' + (i === 0 ? ' is-active' : '');
            b.innerHTML = '<img src="' + img[0] + '" alt="' + img[1] + '">';
            b.addEventListener('click', function () {
                show(i);
            });
            thumbs.appendChild(b);
        });

        function show(i) {
            index = (i + tour.images.length) % tour.images.length;
            main.src = tour.images[index][0];
            main.alt = tour.images[index][1];
            thumbs.querySelectorAll('.tour-gallery__thumb').forEach(function (b, n) {
                b.classList.toggle('is-active', n === index);
            });
        }

        document.querySelector('.tour-gallery__arrow--prev').addEventListener('click', function () {
            show(index - 1);
        });
        document.querySelector('.tour-gallery__arrow--next').addEventListener('click', function () {
            show(index + 1);
        });
        var start = 0, delta = 0;
        document.querySelector('.tour-gallery').addEventListener('touchstart', function (e) {
            start = e.touches[0].clientX;
            delta = 0;
        }, {passive: true});
        document.querySelector('.tour-gallery').addEventListener('touchmove', function (e) {
            delta = e.touches[0].clientX - start;
        }, {passive: true});
        document.querySelector('.tour-gallery').addEventListener('touchend', function () {
            if (Math.abs(delta) > 45) show(index + (delta < 0 ? 1 : -1));
        });
    })();
</script>
</body>
</html>
